name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format, type-check, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Corepack must own the `yarn` shim before setup-node's `cache: yarn`
      # probe runs: the probe calls `yarn --version`, and the runner's global
      # Yarn 1.22 refuses to run in a repo pinning "packageManager": "yarn@4.x".
      # setup-node has no pre-cache hook, so it runs twice -- once to put Node
      # on PATH, then again once Corepack is active and the probe detects Berry.
      # The second call re-uses the Node from the first, so it costs ~a second.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn

      - run: yarn install --immutable

      - name: Set up env file
        run: cp .env.example .env.local

      - name: Format check
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn run check

      - name: Unit tests
        run: yarn test

  e2e:
    name: Cypress e2e
    needs: checks
    runs-on: ubuntu-latest
    env:
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      STORAGE_EMULATOR_HOST: 127.0.0.1:9199
      FIREBASE_PROJECT_ID: demo-gbstem
      PUBLIC_FIREBASE_PROJECT_ID: demo-gbstem
    steps:
      - uses: actions/checkout@v7

      # See the note in the `checks` job: setup-node runs twice so that Corepack
      # owns the `yarn` shim before the `cache: yarn` probe inspects it.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - run: yarn install --immutable

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Set up env file
        run: cp .env.example .env.local

      # This job is the only one with an emulator, and firestore.rules can only
      # be evaluated by one - `yarn test` mocks Firestore entirely, so a rule
      # that grants too much passes it silently. Its own emulators:exec rather
      # than being folded into the Cypress command below: `&` binds looser than
      # `&&` in the shell, so chaining them would background the whole thing and
      # surface a rules failure as a wait-on timeout instead of itself.
      - name: Run security rules tests against Firebase emulators
        run: firebase emulators:exec --project demo-gbstem 'yarn test:rules'

      - name: Start dev server + run Cypress against Firebase emulators
        run: |
          firebase emulators:exec --project demo-gbstem \
            'yarn dev & npx wait-on http://localhost:5173 --timeout 60000 && yarn cypress'
