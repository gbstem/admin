name: Dependabot auto-merge

# Queues non-major Dependabot PRs for auto-merge. The merge itself is performed
# by GitHub once the *required* status checks on `main` pass -- this workflow
# only asks for it. The required checks are configured in the repo ruleset
# (Settings > Rules), currently:
#   - Lint, format, type-check, unit tests
#   - Cypress e2e
#   - Vercel <en dash> admin     (the gb-stem-s-projects deployment)
# Other Vercel projects attached to this repo (currently the legacy
# yuenlers-projects/gbstem-admin-dz80) are deliberately NOT required, so their
# failures do not gate merges.
#
# Those other projects can't be disconnected (they live in scopes we no longer
# control, sharing the one Vercel GitHub App installation on this org), so
# vercel.json's ignoreCommand makes them skip every build instead: it builds only
# where the GBSTEM_CANONICAL_VERCEL_PROJECT env var is set, which it is solely in
# the gb-stem-s-projects project. JSON can't hold that explanation, so it lives
# here. Removing the variable from that project silently stops all deployments.
#
# WATCH OUT WHEN CLEANING UP THOSE DUPLICATES: Vercel names its status context
# based on how many projects are connected to THIS REPO -- not on how many exist
# in the Vercel account. Two or more projects gives the qualified
# "Vercel <en dash> admin" form; drop back to a single project and it is
# expected to revert to the bare context "Vercel". Confirmed in the other
# direction in gbstem/curriculum: through 2025 its lone project posted as
# "Vercel", and it was renamed to "Vercel - gbstem-curriculum" when a second
# project was connected in 2026.
#
# So disconnecting the legacy duplicate will likely rename the required check
# below, leaving it permanently pending and blocking every PR -- Dependabot and
# human alike -- until the ruleset is updated to the new name.
#
# If auto-merge stops working, check that ruleset first: a check that is renamed
# or removed leaves the PR waiting forever rather than failing loudly.

on:
  pull_request:
    branches: [main]

# Workflow runs triggered by Dependabot get a read-only token by default;
# this raises it. Repository secrets are still unavailable to these runs.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge Dependabot PR
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      # Majors still open a PR, they just wait for a human. For the grouped
      # minor-and-patch PRs, update-type is the highest change across the whole
      # group, so one major in the group holds back the rest.
      - name: Enable auto-merge for non-major updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
